components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    EngagementStatus:
      type: string
      enum: [draft, active, collecting, ready_for_analysis, exported, archived]

    Dimension:
      type: string
      enum: [tooling, measurement, process, people, governance, culture]

    Confidence:
      type: string
      enum: [low, medium, high]

    SignalType:
      type: string
      enum: [strength, gap, risk, quote]

    SourceType:
      type: string
      enum: [system, survey, interview, artifact, override]

    DeliverableStatus:
      type: string
      enum: [draft, reviewed, locked]

    ConnectorKind:
      type: string
      enum: [github, gitlab, jira, linear, cicd, ai_tooling]

    AuthedUser:
      type: object
      required: [id, email, role, createdAt]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        role: { type: string, enum: [admin, assessor, viewer] }
        createdAt: { type: string }

    EngagementMember:
      type: object
      required: [id, engagementId, email, role, status, createdAt]
      properties:
        id: { type: string }
        engagementId: { type: string }
        userId: { type: string, nullable: true }
        email: { type: string }
        name: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        role: { type: string, enum: [owner, assessor, viewer] }
        status: { type: string, enum: [pending, active] }
        invitedBy: { type: string, nullable: true }
        createdAt: { type: string }

    AddEngagementMemberInput:
      type: object
      required: [email, role]
      properties:
        email: { type: string }
        role: { type: string, enum: [owner, assessor, viewer] }

    Engagement:
      type: object
      required:
        [id, clientName, sponsor, teamCount, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        clientName: { type: string }
        sponsor: { type: string }
        teamCount: { type: integer }
        scope: { type: string }
        industry: { type: string, nullable: true }
        teams:
          type: array
          items: { type: string }
        kickoffDate: { type: string, nullable: true }
        targetDeliveryDate: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/EngagementStatus" }
        modules:
          type: array
          items: { type: string, enum: [security, data, platform, design] }
        createdAt: { type: string }
        updatedAt: { type: string }

    CreateEngagementInput:
      type: object
      required: [clientName, sponsor, teamCount]
      properties:
        clientName: { type: string }
        sponsor: { type: string }
        teamCount: { type: integer, minimum: 1 }
        scope: { type: string }
        industry: { type: string, nullable: true }
        teams:
          type: array
          items: { type: string }
        kickoffDate: { type: string, nullable: true }
        targetDeliveryDate: { type: string, nullable: true }
        modules:
          type: array
          items: { type: string, enum: [security, data, platform, design] }

    UpdateEngagementInput:
      type: object
      properties:
        clientName: { type: string }
        sponsor: { type: string }
        teamCount: { type: integer }
        scope: { type: string }
        industry: { type: string, nullable: true }
        teams:
          type: array
          items: { type: string }
        kickoffDate: { type: string, nullable: true }
        targetDeliveryDate: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/EngagementStatus" }
        modules:
          type: array
          items: { type: string, enum: [security, data, platform, design] }

    PortfolioSizeBand:
      type: string
      enum: [small, medium, large]
      description: Derived from teamCount — small ≤5, medium 6–25, large >25.

    PortfolioStallReason:
      type: string
      enum: [low_survey_response, stale_connectors, no_finalized_deliverable]

    PortfolioEngagement:
      type: object
      required:
        [
          id,
          clientName,
          sponsor,
          teamCount,
          sizeBand,
          status,
          createdAt,
          updatedAt,
          surveyResponseRate,
          surveySent,
          surveyCompleted,
          connectorsTotal,
          connectorsHealthy,
          finalizedDeliverableCount,
          totalDeliverableCount,
          stallReasons,
        ]
      properties:
        id: { type: string }
        clientName: { type: string }
        sponsor: { type: string }
        industry: { type: string, nullable: true }
        teamCount: { type: integer }
        sizeBand: { $ref: "#/components/schemas/PortfolioSizeBand" }
        status: { $ref: "#/components/schemas/EngagementStatus" }
        createdAt: { type: string }
        updatedAt: { type: string }
        targetDeliveryDate: { type: string, nullable: true }
        overallScore: { type: number, nullable: true }
        overallStage: { type: integer, nullable: true }
        rubricVersion: { type: string, nullable: true }
        surveyResponseRate: { type: number }
        surveySent: { type: integer }
        surveyCompleted: { type: integer }
        connectorsTotal: { type: integer }
        connectorsHealthy: { type: integer }
        lastConnectorRunAt: { type: string, nullable: true }
        lastActivityAt: { type: string, nullable: true }
        finalizedDeliverableCount: { type: integer }
        totalDeliverableCount: { type: integer }
        stallReasons:
          type: array
          items: { $ref: "#/components/schemas/PortfolioStallReason" }

    PortfolioSummary:
      type: object
      required: [engagements, stalledCount, industries, generatedAt]
      properties:
        engagements:
          type: array
          items: { $ref: "#/components/schemas/PortfolioEngagement" }
        stalledCount: { type: integer }
        industries:
          type: array
          items: { type: string }
        generatedAt: { type: string }

    PortfolioHeatmapCell:
      type: object
      required: [dimension, meanScore, meanStage, count]
      properties:
        dimension: { $ref: "#/components/schemas/Dimension" }
        meanScore: { type: number, nullable: true }
        meanStage: { type: number, nullable: true }
        count: { type: integer }
        suppressed: { type: boolean }

    PortfolioHeatmap:
      type: object
      required: [cells, engagementCount, anonymityFloor, generatedAt]
      properties:
        cells:
          type: array
          items: { $ref: "#/components/schemas/PortfolioHeatmapCell" }
        engagementCount: { type: integer }
        anonymityFloor: { type: integer }
        appliedFilters:
          type: object
          additionalProperties: true
        generatedAt: { type: string }

    PortfolioDistributionEngagementRef:
      type: object
      required: [id, clientName, teamCount]
      properties:
        id: { type: string }
        clientName: { type: string }
        # Team size for the engagement, used by the snapshot bar to sort
        # the per-stage engagement lists from largest to smallest so the
        # top-N display is meaningful.
        teamCount: { type: integer, minimum: 0 }

    PortfolioDistributionStageBin:
      type: object
      required: [stage, label, count, percent, engagements]
      properties:
        stage: { type: integer, minimum: 1, maximum: 5 }
        label: { type: string }
        count: { type: integer }
        percent: { type: number }
        engagements:
          type: array
          items: { $ref: "#/components/schemas/PortfolioDistributionEngagementRef" }

    PortfolioDistribution:
      type: object
      required: [month, total, byStage, notYetAssessed, generatedAt]
      properties:
        month:
          type: string
          description: ISO month (YYYY-MM) the snapshot represents.
        total:
          type: integer
          description: Number of engagements with a scoring snapshot for this month.
        byStage:
          type: array
          items: { $ref: "#/components/schemas/PortfolioDistributionStageBin" }
        notYetAssessed:
          type: array
          items: { $ref: "#/components/schemas/PortfolioDistributionEngagementRef" }
        generatedAt: { type: string }

    PortfolioDistributionHistoryPoint:
      type: object
      required: [month, total, byStage]
      properties:
        month: { type: string }
        total: { type: integer }
        byStage:
          type: array
          items:
            type: object
            required: [stage, count, percent]
            properties:
              stage: { type: integer, minimum: 1, maximum: 5 }
              count: { type: integer }
              percent: { type: number }

    PortfolioDistributionHistory:
      type: object
      required: [from, to, months, generatedAt]
      properties:
        from: { type: string }
        to: { type: string }
        months:
          type: array
          items: { $ref: "#/components/schemas/PortfolioDistributionHistoryPoint" }
        generatedAt: { type: string }

    EngagementDashboard:
      type: object
      required:
        [
          engagementId,
          surveyResponseRate,
          surveySent,
          surveyCompleted,
          interviewsCompleted,
          interviewsTotal,
          artifactCount,
          connectorsHealthy,
          connectorsTotal,
          daysToTarget,
          deliverableStatuses,
        ]
      properties:
        engagementId: { type: string }
        surveyResponseRate: { type: number }
        surveySent: { type: integer }
        surveyCompleted: { type: integer }
        interviewsCompleted: { type: integer }
        interviewsTotal: { type: integer }
        artifactCount: { type: integer }
        connectorsHealthy: { type: integer }
        connectorsTotal: { type: integer }
        daysToTarget: { type: integer, nullable: true }
        evidenceCount: { type: integer }
        deliverableStatuses:
          type: object
          required: [heatmap, gapAnalysis, actionPlan, entryPoint, npv]
          properties:
            heatmap: { $ref: "#/components/schemas/DeliverableStatus" }
            gapAnalysis: { $ref: "#/components/schemas/DeliverableStatus" }
            actionPlan: { $ref: "#/components/schemas/DeliverableStatus" }
            entryPoint: { $ref: "#/components/schemas/DeliverableStatus" }
            npv: { $ref: "#/components/schemas/DeliverableStatus" }

    ActivityEvent:
      type: object
      required: [id, kind, message, createdAt, severity]
      properties:
        id: { type: string }
        kind: { type: string }
        message: { type: string }
        createdAt: { type: string }
        actorUserId: { type: string, nullable: true }
        actorName: { type: string, nullable: true }
        actorEmail: { type: string, nullable: true }
        actorAvatarUrl: { type: string, nullable: true }
        severity:
          type: string
          enum: [info, critical]
        payload:
          type: object
          additionalProperties: true
          description: Structured before/after detail captured by the emitting route.
        requestId:
          type: string
          nullable: true
          description: Correlation id matching the x-request-id response header and pino logs.

    Connector:
      type: object
      required: [id, engagementId, kind, label, status, createdAt, scheduleEnabled, scheduleCadenceMinutes]
      properties:
        id: { type: string }
        engagementId: { type: string }
        kind: { $ref: "#/components/schemas/ConnectorKind" }
        provider: { type: string }
        label: { type: string }
        status:
          type: string
          enum: [not_configured, configured, collecting, collected, failed]
        config:
          type: object
          additionalProperties: true
        lastRunAt: { type: string, nullable: true }
        lastSuccessAt: { type: string, nullable: true }
        lastError: { type: string, nullable: true }
        scheduleEnabled:
          type: boolean
          description: When true, the background scheduler runs this connector on cadence.
        scheduleCadenceMinutes:
          type: integer
          minimum: 5
          maximum: 43200
          description: Minutes between scheduled runs. Defaults to 1440 (daily).
        nextRunAt:
          type: string
          nullable: true
          description: When the scheduler will next pick up this connector.
        createdAt: { type: string }

    CreateConnectorInput:
      type: object
      required: [kind, provider, label]
      properties:
        kind: { $ref: "#/components/schemas/ConnectorKind" }
        provider: { type: string }
        label: { type: string }
        token: { type: string }
        config:
          type: object
          additionalProperties: true

    VerifyConnectorConfigInput:
      type: object
      required: [kind, provider]
      properties:
        kind: { $ref: "#/components/schemas/ConnectorKind" }
        provider: { type: string }
        token: { type: string }
        config:
          type: object
          additionalProperties: true

    UpdateConnectorInput:
      type: object
      properties:
        label: { type: string }
        token: { type: string }
        config:
          type: object
          additionalProperties: true
        scheduleEnabled: { type: boolean }
        scheduleCadenceMinutes:
          type: integer
          minimum: 5
          maximum: 43200

    ConnectorSignals:
      type: object
      required: [connectorId, evidence]
      properties:
        connectorId: { type: string }
        latestRun:
          allOf:
            - $ref: "#/components/schemas/ConnectorRun"
          nullable: true
        evidence:
          type: array
          items:
            type: object
            required: [id, dimension, signalType, text, createdAt]
            properties:
              id: { type: string }
              dimension: { type: string }
              signalType: { type: string }
              stageHint: { type: integer, nullable: true }
              text: { type: string }
              createdAt: { type: string }

    ConnectorVerifyResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        message: { type: string }
        details:
          type: object
          additionalProperties: true

    ConnectorRun:
      type: object
      required: [id, connectorId, status, startedAt]
      properties:
        id: { type: string }
        connectorId: { type: string }
        status:
          type: string
          enum: [running, success, failed]
        startedAt: { type: string }
        finishedAt: { type: string, nullable: true }
        recordsCollected: { type: integer }
        error: { type: string, nullable: true }
        summary:
          type: object
          additionalProperties: true

    SurveyQuestion:
      type: object
      required: [id, section, dimension, type, prompt]
      properties:
        id: { type: string }
        section: { type: string }
        dimension: { type: string, nullable: true }
        type:
          type: string
          enum: [single_select, multi_select, likert, rank, demographic]
        prompt: { type: string }
        options:
          type: array
          items: { type: string }
        likertMin: { type: integer, nullable: true }
        likertMax: { type: integer, nullable: true }
        likertMinLabel: { type: string, nullable: true }
        likertMaxLabel: { type: string, nullable: true }
        rankCount: { type: integer, nullable: true }
        moduleKey: { type: string, nullable: true }
        conditionalOn: { type: string, nullable: true }

    Survey:
      type: object
      required: [engagementId, templateVersion, modules, questions]
      properties:
        engagementId: { type: string }
        templateVersion: { type: string }
        modules:
          type: array
          items: { type: string, enum: [security, data, platform, design] }
        questions:
          type: array
          items: { $ref: "#/components/schemas/SurveyQuestion" }
        nudgeSchedule:
          type: array
          items: { type: integer }
        closedAt: { type: string, nullable: true }

    UpdateSurveyInput:
      type: object
      properties:
        modules:
          type: array
          items: { type: string, enum: [security, data, platform, design] }
        questions:
          type: array
          items: { $ref: "#/components/schemas/SurveyQuestion" }
        nudgeSchedule:
          type: array
          items: { type: integer }

    SurveyInvite:
      type: object
      required: [id, engagementId, team, status, createdAt]
      properties:
        id: { type: string }
        engagementId: { type: string }
        team: { type: string }
        role: { type: string, nullable: true }
        emailHash: { type: string, nullable: true }
        token: { type: string }
        status:
          type: string
          enum: [sent, opened, started, completed]
        createdAt: { type: string }
        completedAt: { type: string, nullable: true }
        nudgesSent:
          type: array
          items: { type: integer }
        magicLinkToken: { type: string }

    CreateSurveyInvitesInput:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items:
            type: object
            required: [team]
            properties:
              team: { type: string }
              email: { type: string }
              role: { type: string }

    PreviewInvitesInput:
      type: object
      required: [csv]
      properties:
        csv: { type: string }

    InvitePreview:
      type: object
      required: [rows, validCount, invalidCount]
      properties:
        validCount: { type: integer }
        invalidCount: { type: integer }
        rows:
          type: array
          items:
            type: object
            required: [line, valid]
            properties:
              line: { type: integer }
              valid: { type: boolean }
              team: { type: string, nullable: true }
              email: { type: string, nullable: true }
              role: { type: string, nullable: true }
              error: { type: string, nullable: true }

    PublicSurvey:
      type: object
      required: [engagementClient, questions, status]
      properties:
        engagementClient: { type: string }
        status:
          type: string
          enum: [open, completed, expired, closed]
        questions:
          type: array
          items: { $ref: "#/components/schemas/SurveyQuestion" }
        savedAnswers:
          type: array
          items:
            type: object
            required: [questionId, value]
            properties:
              questionId: { type: string }
              value:
                oneOf:
                  - { type: string }
                  - { type: number }
                  - { type: array, items: { type: string } }

    SaveSurveyDraftInput:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            type: object
            required: [questionId, value]
            properties:
              questionId: { type: string }
              value:
                oneOf:
                  - { type: string }
                  - { type: number }
                  - { type: array, items: { type: string } }

    SubmitSurveyResponseInput:
      type: object
      required: [answers, demographics]
      properties:
        answers:
          type: array
          items:
            type: object
            required: [questionId, value]
            properties:
              questionId: { type: string }
              value:
                oneOf:
                  - { type: string }
                  - { type: number }
                  - { type: array, items: { type: string } }
        demographics:
          type: object
          additionalProperties: { type: string }

    SurveyAggregates:
      type: object
      required:
        [responseRate, totalSent, totalCompleted, byQuestion, byTeam, byRole, funnel, aggregateSuppressed]
      properties:
        responseRate: { type: number }
        totalSent: { type: integer }
        totalCompleted: { type: integer }
        aggregateSuppressed: { type: boolean }
        funnel:
          type: object
          required: [sent, opened, started, completed]
          properties:
            sent: { type: integer }
            opened: { type: integer }
            started: { type: integer }
            completed: { type: integer }
        byQuestion:
          type: array
          items:
            type: object
            required: [questionId, distribution]
            properties:
              questionId: { type: string }
              average: { type: number, nullable: true }
              distribution:
                type: array
                items:
                  type: object
                  required: [value, count]
                  properties:
                    value: { type: string }
                    count: { type: integer }
        byTeam:
          type: array
          items:
            type: object
            required: [team, suppressed]
            properties:
              team: { type: string }
              # Null when `suppressed` is true — the exact sub-floor count is
              # itself an anonymity leak and is intentionally hidden.
              completedCount: { type: integer, nullable: true }
              # Number of invites sent to this team. Always exposed (the
              # assessor sent the invites), and used by the dashboard to
              # render per-team completion bars.
              invitedCount: { type: integer }
              suppressed: { type: boolean }
              dimensionAverages:
                type: object
                additionalProperties: { type: number }
        byRole:
          type: array
          items:
            type: object
            required: [role, suppressed]
            properties:
              role: { type: string }
              completedCount: { type: integer, nullable: true }
              suppressed: { type: boolean }

    Interview:
      type: object
      required: [id, engagementId, interviewee, role, status, createdAt]
      properties:
        id: { type: string }
        engagementId: { type: string }
        interviewee: { type: string }
        role: { type: string }
        date: { type: string, nullable: true }
        consent: { type: boolean }
        notes: { type: string }
        status: { type: string, enum: [draft, tagged, reviewed] }
        evidenceCount: { type: integer }
        createdAt: { type: string }

    CreateInterviewInput:
      type: object
      required: [interviewee, role]
      properties:
        interviewee: { type: string }
        role: { type: string }
        date: { type: string, nullable: true }
        consent: { type: boolean }
        notes: { type: string }

    UpdateInterviewInput:
      type: object
      properties:
        interviewee: { type: string }
        role: { type: string }
        date: { type: string, nullable: true }
        consent: { type: boolean }
        notes: { type: string }
        status: { type: string, enum: [draft, tagged, reviewed] }

    Evidence:
      type: object
      required: [id, engagementId, sourceType, dimension, signalType, text, createdAt]
      properties:
        id: { type: string }
        engagementId: { type: string }
        interviewId: { type: string, nullable: true }
        sourceType: { $ref: "#/components/schemas/SourceType" }
        sourceRef: { type: string, nullable: true }
        dimension: { $ref: "#/components/schemas/Dimension" }
        signalType: { $ref: "#/components/schemas/SignalType" }
        stageHint: { type: integer, nullable: true }
        text: { type: string }
        createdBy: { type: string, nullable: true }
        createdAt: { type: string }

    CreateEvidenceInput:
      type: object
      required: [dimension, signalType, text]
      properties:
        dimension: { $ref: "#/components/schemas/Dimension" }
        signalType: { $ref: "#/components/schemas/SignalType" }
        stageHint: { type: integer, nullable: true }
        text: { type: string }

    InterviewTagSuggestions:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items:
            type: object
            required: [text, dimension, signalType]
            properties:
              text: { type: string }
              dimension: { $ref: "#/components/schemas/Dimension" }
              signalType: { $ref: "#/components/schemas/SignalType" }
              stageHint: { type: integer, nullable: true }
              rationale: { type: string }

    ArtifactDoc:
      type: object
      required: [id, engagementId, filename, kind, createdAt]
      properties:
        id: { type: string }
        engagementId: { type: string }
        filename: { type: string }
        kind: { type: string }
        sizeBytes: { type: integer }
        extractedSummary: { type: string }
        # MIME type of the original uploaded file. The download endpoint uses
        # this to set Content-Type so PDFs render natively in the browser.
        mimeType: { type: string }
        # True when an original binary is on file (PDF/DOCX). False for
        # legacy paste-only uploads. Drives whether the UI shows a "Download"
        # vs a plain text view.
        hasBinary: { type: boolean }
        createdAt: { type: string }

    CreateArtifactInput:
      type: object
      required: [filename, kind, content]
      properties:
        filename: { type: string }
        kind: { type: string }
        # Extracted plain-text representation. Used for analysis & summaries.
        # For PDFs the client extracts text and sends it here; for plain
        # text/markdown uploads it's the raw file body.
        content: { type: string }
        # MIME type of the original uploaded file (e.g. "application/pdf").
        # Optional — defaults to "text/plain" when omitted (legacy paste flow).
        mimeType: { type: string }
        # Object storage path for the uploaded binary, e.g. `/objects/uploads/<uuid>`.
        # Returned by `POST /storage/uploads/request-url`. Optional — when omitted
        # the download endpoint streams `content` as text/plain (legacy paste flow).
        objectPath: { type: string }
        # Original file size in bytes. Used to populate the `sizeBytes` column
        # for binary uploads (we can't infer it from `content` alone). Ignored
        # when `objectPath` is omitted.
        sizeBytes: { type: integer }

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }

    DimensionScore:
      type: object
      required: [dimension, score, stage, confidence, evidenceIds, rationale]
      properties:
        dimension: { $ref: "#/components/schemas/Dimension" }
        score: { type: number }
        stage: { type: integer, minimum: 1, maximum: 5 }
        confidence: { $ref: "#/components/schemas/Confidence" }
        evidenceIds:
          type: array
          items: { type: string }
        rationale: { type: string }
        narrative: { type: string, nullable: true }
        narrativeUpdatedByName: { type: string, nullable: true }
        narrativeUpdatedByEmail: { type: string, nullable: true }
        narrativeUpdatedAt: { type: string, nullable: true }
        overrideJustification: { type: string, nullable: true }
        overrideAuthorName: { type: string, nullable: true }
        overrideAuthorEmail: { type: string, nullable: true }
        overrideAt: { type: string, nullable: true }
        signalsBySource:
          type: object
          properties:
            system: { type: integer }
            survey: { type: integer }
            interview: { type: integer }
            artifact: { type: integer }

    Scoring:
      type: object
      required: [engagementId, rubricVersion, byDimension, overall, computedAt]
      properties:
        engagementId: { type: string }
        rubricVersion: { type: string }
        rubricVersionId: { type: string, nullable: true }
        byDimension:
          type: array
          items: { $ref: "#/components/schemas/DimensionScore" }
        overall:
          type: object
          required: [score, stage, confidence]
          properties:
            score: { type: number }
            stage: { type: integer }
            confidence: { $ref: "#/components/schemas/Confidence" }
        computedAt: { type: string }

    RubricBody:
      type: object
      required: [dimensions]
      properties:
        dimensions:
          type: array
          items:
            type: object
            required: [dimension, stages]
            properties:
              dimension: { $ref: "#/components/schemas/Dimension" }
              description: { type: string }
              stages:
                type: array
                items:
                  type: object
                  required: [stage, summary]
                  properties:
                    stage: { type: integer, minimum: 1, maximum: 5 }
                    summary: { type: string }
                    indicators:
                      type: array
                      items: { type: string }
        dimensionWeights:
          type: object
          additionalProperties: { type: number }

    RubricVersion:
      type: object
      required: [id, version, status, body, createdAt]
      properties:
        id: { type: string }
        version: { type: string }
        status: { type: string, enum: [draft, published] }
        body: { $ref: "#/components/schemas/RubricBody" }
        notes: { type: string }
        createdByEmail: { type: string, nullable: true }
        publishedAt: { type: string, nullable: true }
        createdAt: { type: string }

    ScoreOverrideInput:
      type: object
      required: [dimension, stage, justification]
      properties:
        dimension: { $ref: "#/components/schemas/Dimension" }
        stage: { type: integer, minimum: 1, maximum: 5 }
        score: { type: number, nullable: true }
        justification: { type: string }

    ScoringNarrativeInput:
      type: object
      required: [dimension, narrative]
      properties:
        dimension: { $ref: "#/components/schemas/Dimension" }
        narrative: { type: string, description: "Empty string clears the narrative." }

    ScoringNarrativeResponse:
      type: object
      required: [engagementId, dimension]
      properties:
        engagementId: { type: string }
        dimension: { $ref: "#/components/schemas/Dimension" }
        narrative: { type: string, nullable: true }
        narrativeUpdatedByName: { type: string, nullable: true }
        narrativeUpdatedByEmail: { type: string, nullable: true }
        narrativeUpdatedAt: { type: string, nullable: true }

    HeatmapCell:
      type: object
      required: [dimension, currentStage, targetStage, confidence]
      properties:
        dimension: { $ref: "#/components/schemas/Dimension" }
        currentStage: { type: integer }
        targetStage: { type: integer }
        confidence: { $ref: "#/components/schemas/Confidence" }
        notes: { type: string, nullable: true }

    GapAnalysisItem:
      type: object
      required: [dimension, currentStage, targetStage, narrativeMd, evidenceIds]
      properties:
        dimension: { $ref: "#/components/schemas/Dimension" }
        currentStage: { type: integer }
        targetStage: { type: integer }
        narrativeMd: { type: string }
        gaps:
          type: array
          items: { type: string }
        evidenceIds:
          type: array
          items: { type: string }

    ActionItem:
      type: object
      required: [id, initiative, dimension, priority, effort, impact]
      properties:
        id: { type: string }
        initiative: { type: string }
        dimension: { $ref: "#/components/schemas/Dimension" }
        priority: { type: string, enum: [P0, P1, P2] }
        effort: { type: string, enum: [S, M, L, XL] }
        impact: { type: string, enum: [S, M, L, XL] }
        ownerRole: { type: string }
        successMetric: { type: string }
        dependencies:
          type: array
          items: { type: string }

    EntryPointRecommendation:
      type: object
      required: [recommendedStage, rationaleMd]
      properties:
        recommendedStage:
          type: string
          enum: [strategy, design, build, ship, run]
        hyprAgents:
          type: array
          items:
            type: object
            required: [name, relevance]
            properties:
              name: { type: string }
              relevance: { type: string }
        rationaleMd: { type: string }
        evidenceIds:
          type: array
          items: { type: string }

    NpvInputs:
      type: object
      required:
        [
          fullyLoadedCost,
          teamCount,
          baselineCycleTimeDays,
          aiAcceptanceRate,
          reworkRate,
          discountRate,
        ]
      properties:
        fullyLoadedCost: { type: number }
        teamCount: { type: integer }
        baselineCycleTimeDays: { type: number }
        aiAcceptanceRate: { type: number }
        reworkRate: { type: number }
        discountRate: { type: number }

    NpvScenario:
      type: object
      required: [npv3yr, paybackMonths, irr]
      properties:
        npv3yr: { type: number }
        paybackMonths: { type: number }
        irr: { type: number }
        annualSavings:
          type: array
          items: { type: number }

    NpvResult:
      type: object
      required: [modelVersion, inputs, scenarios, leverBreakdown]
      properties:
        modelVersion: { type: string }
        inputs: { $ref: "#/components/schemas/NpvInputs" }
        scenarios:
          type: object
          required: [low, base, high]
          properties:
            low: { $ref: "#/components/schemas/NpvScenario" }
            base: { $ref: "#/components/schemas/NpvScenario" }
            high: { $ref: "#/components/schemas/NpvScenario" }
        leverBreakdown:
          type: array
          items:
            type: object
            required: [lever, savings]
            properties:
              lever: { type: string }
              savings: { type: number }

    Deliverables:
      type: object
      required:
        [engagementId, statuses, heatmap, gapAnalysis, actionPlan, entryPoint, npv]
      properties:
        engagementId: { type: string }
        statuses:
          type: object
          required: [heatmap, gapAnalysis, actionPlan, entryPoint, npv]
          properties:
            heatmap: { $ref: "#/components/schemas/DeliverableStatus" }
            gapAnalysis: { $ref: "#/components/schemas/DeliverableStatus" }
            actionPlan: { $ref: "#/components/schemas/DeliverableStatus" }
            entryPoint: { $ref: "#/components/schemas/DeliverableStatus" }
            npv: { $ref: "#/components/schemas/DeliverableStatus" }
        heatmap:
          type: array
          items: { $ref: "#/components/schemas/HeatmapCell" }
        gapAnalysis:
          type: array
          items: { $ref: "#/components/schemas/GapAnalysisItem" }
        actionPlan:
          type: array
          items: { $ref: "#/components/schemas/ActionItem" }
        entryPoint: { $ref: "#/components/schemas/EntryPointRecommendation" }
        npv: { $ref: "#/components/schemas/NpvResult" }
        lockMetadata:
          description: |
            Per-deliverable attribution for any key whose status is `locked`.
            Populated from the latest finalized version row. Keys that are
            not locked are omitted. Used by the result pages to render a
            "Locked by {name} on {date}" badge.
          type: object
          additionalProperties:
            type: object
            required: [lockedAt]
            properties:
              lockedByName: { type: string, nullable: true }
              lockedByEmail: { type: string, nullable: true }
              lockedAt: { type: string }
              version: { type: integer }

    UpdateDeliverablesInput:
      type: object
      properties:
        statuses:
          type: object
          properties:
            heatmap: { $ref: "#/components/schemas/DeliverableStatus" }
            gapAnalysis: { $ref: "#/components/schemas/DeliverableStatus" }
            actionPlan: { $ref: "#/components/schemas/DeliverableStatus" }
            entryPoint: { $ref: "#/components/schemas/DeliverableStatus" }
            npv: { $ref: "#/components/schemas/DeliverableStatus" }
        heatmap:
          type: array
          items: { $ref: "#/components/schemas/HeatmapCell" }
        gapAnalysis:
          type: array
          items: { $ref: "#/components/schemas/GapAnalysisItem" }
        actionPlan:
          type: array
          items: { $ref: "#/components/schemas/ActionItem" }
        entryPoint: { $ref: "#/components/schemas/EntryPointRecommendation" }
        npv: { $ref: "#/components/schemas/NpvResult" }

    DeliverableKey:
      type: string
      enum: [heatmap, gapAnalysis, actionPlan, entryPoint, npv]

    DeliverableVersion:
      type: object
      required: [id, engagementId, key, version, createdAt, finalized, snapshot]
      properties:
        id: { type: string }
        engagementId: { type: string }
        key: { $ref: "#/components/schemas/DeliverableKey" }
        version: { type: integer }
        finalized: { type: boolean }
        authorEmail: { type: string, nullable: true }
        createdAt: { type: string }
        snapshot:
          description: |
            Frozen serialized form of the deliverable at this version. The shape
            depends on `key`: heatmap and actionPlan serialize as arrays, while
            gapAnalysis, entryPoint, and npv serialize as objects. Treat as
            opaque JSON and re-validate against the deliverable's typed schema
            on read.
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}

    ExportRecord:
      type: object
      required: [id, engagementId, version, createdAt, files]
      properties:
        id: { type: string }
        engagementId: { type: string }
        version: { type: integer }
        createdAt: { type: string }
        signature: { type: string }
        finalizerEmail: { type: string, nullable: true }
        files:
          type: array
          items:
            type: object
            required: [name, sizeBytes]
            properties:
              name: { type: string }
              sizeBytes: { type: integer }
              downloadUrl: { type: string }
