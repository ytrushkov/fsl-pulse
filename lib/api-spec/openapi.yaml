openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Pulse — Agentic Maturity Assessment Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: engagements
  - name: connectors
  - name: survey
  - name: interviews
  - name: artifacts
  - name: evidence
  - name: scoring
  - name: deliverables
  - name: exports
  - name: ai
  - name: dashboard

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthedUser" }

  /engagements/{id}/members:
    get:
      operationId: listEngagementMembers
      tags: [engagements]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EngagementMember" }
    post:
      operationId: addEngagementMember
      tags: [engagements]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddEngagementMemberInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngagementMember" }

  /engagements/{id}/members/{memberId}:
    delete:
      operationId: removeEngagementMember
      tags: [engagements]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: memberId, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Removed

  /engagements:
    get:
      operationId: listEngagements
      tags: [engagements]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Engagement" }
    post:
      operationId: createEngagement
      tags: [engagements]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEngagementInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Engagement" }

  /engagements/{id}:
    get:
      operationId: getEngagement
      tags: [engagements]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Engagement" }
    patch:
      operationId: updateEngagement
      tags: [engagements]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEngagementInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Engagement" }

  /engagements/{id}/dashboard:
    get:
      operationId: getEngagementDashboard
      tags: [dashboard]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngagementDashboard" }

  /engagements/{id}/activity:
    get:
      operationId: getEngagementActivity
      tags: [dashboard]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: kind
          in: query
          required: false
          description: Comma-separated list of activity kinds to include.
          schema: { type: string }
        - name: severity
          in: query
          required: false
          schema: { type: string, enum: [info, critical] }
        - name: actor
          in: query
          required: false
          description: Case-insensitive substring match against actor name or email.
          schema: { type: string }
        - name: from
          in: query
          required: false
          description: ISO timestamp lower bound (inclusive).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: ISO timestamp upper bound (inclusive).
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityEvent" }

  /engagements/{id}/activity.csv:
    get:
      operationId: exportEngagementActivityCsv
      tags: [dashboard]
      summary: Admin-only CSV export of the audit log (same filters as GET /activity).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: kind, in: query, required: false, schema: { type: string } }
        - { name: severity, in: query, required: false, schema: { type: string, enum: [info, critical] } }
        - { name: actor, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        "403":
          description: Admin role required

  /engagements/{id}/connectors:
    get:
      operationId: listConnectors
      tags: [connectors]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Connector" }
    post:
      operationId: createConnector
      tags: [connectors]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConnectorInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connector" }

  /connectors/{connectorId}:
    patch:
      operationId: updateConnector
      tags: [connectors]
      parameters:
        - { name: connectorId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateConnectorInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connector" }
    delete:
      operationId: deleteConnector
      tags: [connectors]
      parameters:
        - { name: connectorId, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Deleted

  /connectors/{connectorId}/verify:
    post:
      operationId: verifyConnector
      tags: [connectors]
      parameters:
        - { name: connectorId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorVerifyResult" }

  /connectors/{connectorId}/run:
    post:
      operationId: runConnector
      tags: [connectors]
      parameters:
        - { name: connectorId, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorRun" }

  /connectors/{connectorId}/runs:
    get:
      operationId: listConnectorRuns
      tags: [connectors]
      parameters:
        - { name: connectorId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConnectorRun" }

  /engagements/{id}/survey:
    get:
      operationId: getSurvey
      tags: [survey]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Survey" }
    patch:
      operationId: updateSurvey
      tags: [survey]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSurveyInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Survey" }

  /engagements/{id}/survey/invites:
    get:
      operationId: listSurveyInvites
      tags: [survey]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SurveyInvite" }
    post:
      operationId: createSurveyInvites
      tags: [survey]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSurveyInvitesInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SurveyInvite" }

  /engagements/{id}/survey/responses:
    get:
      operationId: getSurveyAggregates
      tags: [survey]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SurveyAggregates" }

  /survey/respond/{token}:
    get:
      operationId: getSurveyByToken
      tags: [survey]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicSurvey" }
    post:
      operationId: submitSurveyResponse
      tags: [survey]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitSurveyResponseInput" }
      responses:
        "204":
          description: Submitted

  /engagements/{id}/interviews:
    get:
      operationId: listInterviews
      tags: [interviews]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Interview" }
    post:
      operationId: createInterview
      tags: [interviews]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInterviewInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Interview" }

  /interviews/{interviewId}:
    get:
      operationId: getInterview
      tags: [interviews]
      parameters:
        - { name: interviewId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Interview" }
    patch:
      operationId: updateInterview
      tags: [interviews]
      parameters:
        - { name: interviewId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateInterviewInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Interview" }
    delete:
      operationId: deleteInterview
      tags: [interviews]
      parameters:
        - { name: interviewId, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Deleted

  /interviews/{interviewId}/evidence:
    get:
      operationId: listInterviewEvidence
      tags: [interviews]
      parameters:
        - { name: interviewId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Evidence" }
    post:
      operationId: addInterviewEvidence
      tags: [interviews]
      parameters:
        - { name: interviewId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEvidenceInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evidence" }

  /evidence/{evidenceId}:
    delete:
      operationId: deleteEvidence
      tags: [evidence]
      parameters:
        - { name: evidenceId, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Deleted

  /interviews/{interviewId}/ai-suggest:
    post:
      operationId: suggestInterviewTags
      tags: [ai]
      parameters:
        - { name: interviewId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterviewTagSuggestions" }

  /engagements/{id}/artifacts:
    get:
      operationId: listArtifacts
      tags: [artifacts]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ArtifactDoc" }
    post:
      operationId: createArtifact
      tags: [artifacts]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateArtifactInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactDoc" }

  /artifacts/{artifactId}:
    delete:
      operationId: deleteArtifactDoc
      tags: [artifacts]
      parameters:
        - { name: artifactId, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Deleted

  /engagements/{id}/evidence:
    get:
      operationId: listEngagementEvidence
      tags: [evidence]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Evidence" }

  /engagements/{id}/scoring:
    get:
      operationId: getScoring
      tags: [scoring]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scoring" }
    post:
      operationId: computeScoring
      tags: [scoring]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scoring" }

  /engagements/{id}/scoring/override:
    post:
      operationId: overrideDimensionScore
      tags: [scoring]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScoreOverrideInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scoring" }

  /engagements/{id}/deliverables:
    get:
      operationId: getDeliverables
      tags: [deliverables]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deliverables" }
    patch:
      operationId: updateDeliverables
      tags: [deliverables]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDeliverablesInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deliverables" }

  /engagements/{id}/deliverables/draft:
    post:
      operationId: draftDeliverables
      tags: [ai]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deliverables" }

  /engagements/{id}/exports:
    get:
      operationId: listExports
      tags: [exports]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExportRecord" }
    post:
      operationId: createExport
      tags: [exports]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportRecord" }

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    EngagementStatus:
      type: string
      enum: [draft, active, collecting, ready_for_analysis, exported, archived]

    Dimension:
      type: string
      enum: [tooling, measurement, process, people, governance, culture]

    Confidence:
      type: string
      enum: [low, medium, high]

    SignalType:
      type: string
      enum: [strength, gap, risk, quote]

    SourceType:
      type: string
      enum: [system, survey, interview, artifact, override]

    DeliverableStatus:
      type: string
      enum: [draft, reviewed, locked]

    ConnectorKind:
      type: string
      enum: [github, gitlab, jira, linear, cicd, ai_tooling]

    AuthedUser:
      type: object
      required: [id, email, role, createdAt]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        role: { type: string, enum: [admin, assessor, viewer] }
        createdAt: { type: string }

    EngagementMember:
      type: object
      required: [id, engagementId, email, role, status, createdAt]
      properties:
        id: { type: string }
        engagementId: { type: string }
        userId: { type: string, nullable: true }
        email: { type: string }
        name: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        role: { type: string, enum: [owner, assessor, viewer] }
        status: { type: string, enum: [pending, active] }
        invitedBy: { type: string, nullable: true }
        createdAt: { type: string }

    AddEngagementMemberInput:
      type: object
      required: [email, role]
      properties:
        email: { type: string }
        role: { type: string, enum: [owner, assessor, viewer] }

    Engagement:
      type: object
      required:
        [id, clientName, sponsor, teamCount, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        clientName: { type: string }
        sponsor: { type: string }
        teamCount: { type: integer }
        scope: { type: string }
        teams:
          type: array
          items: { type: string }
        kickoffDate: { type: string, nullable: true }
        targetDeliveryDate: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/EngagementStatus" }
        modules:
          type: array
          items: { type: string, enum: [security, data, platform, design] }
        createdAt: { type: string }
        updatedAt: { type: string }

    CreateEngagementInput:
      type: object
      required: [clientName, sponsor, teamCount]
      properties:
        clientName: { type: string }
        sponsor: { type: string }
        teamCount: { type: integer, minimum: 1 }
        scope: { type: string }
        teams:
          type: array
          items: { type: string }
        kickoffDate: { type: string, nullable: true }
        targetDeliveryDate: { type: string, nullable: true }
        modules:
          type: array
          items: { type: string, enum: [security, data, platform, design] }

    UpdateEngagementInput:
      type: object
      properties:
        clientName: { type: string }
        sponsor: { type: string }
        teamCount: { type: integer }
        scope: { type: string }
        teams:
          type: array
          items: { type: string }
        kickoffDate: { type: string, nullable: true }
        targetDeliveryDate: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/EngagementStatus" }
        modules:
          type: array
          items: { type: string, enum: [security, data, platform, design] }

    EngagementDashboard:
      type: object
      required:
        [
          engagementId,
          surveyResponseRate,
          surveySent,
          surveyCompleted,
          interviewsCompleted,
          interviewsTotal,
          artifactCount,
          connectorsHealthy,
          connectorsTotal,
          daysToTarget,
          deliverableStatuses,
        ]
      properties:
        engagementId: { type: string }
        surveyResponseRate: { type: number }
        surveySent: { type: integer }
        surveyCompleted: { type: integer }
        interviewsCompleted: { type: integer }
        interviewsTotal: { type: integer }
        artifactCount: { type: integer }
        connectorsHealthy: { type: integer }
        connectorsTotal: { type: integer }
        daysToTarget: { type: integer, nullable: true }
        evidenceCount: { type: integer }
        deliverableStatuses:
          type: object
          required: [heatmap, gapAnalysis, actionPlan, entryPoint, npv]
          properties:
            heatmap: { $ref: "#/components/schemas/DeliverableStatus" }
            gapAnalysis: { $ref: "#/components/schemas/DeliverableStatus" }
            actionPlan: { $ref: "#/components/schemas/DeliverableStatus" }
            entryPoint: { $ref: "#/components/schemas/DeliverableStatus" }
            npv: { $ref: "#/components/schemas/DeliverableStatus" }

    ActivityEvent:
      type: object
      required: [id, kind, message, createdAt, severity]
      properties:
        id: { type: string }
        kind: { type: string }
        message: { type: string }
        createdAt: { type: string }
        actorUserId: { type: string, nullable: true }
        actorName: { type: string, nullable: true }
        actorEmail: { type: string, nullable: true }
        actorAvatarUrl: { type: string, nullable: true }
        severity:
          type: string
          enum: [info, critical]
        payload:
          type: object
          additionalProperties: true
          description: Structured before/after detail captured by the emitting route.
        requestId:
          type: string
          nullable: true
          description: Correlation id matching the x-request-id response header and pino logs.

