openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Pulse — Agentic Maturity Assessment Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: engagements
  - name: connectors
  - name: survey
  - name: interviews
  - name: artifacts
  - name: evidence
  - name: scoring
  - name: deliverables
  - name: exports
  - name: ai
  - name: dashboard
  - name: storage

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthedUser" }

  /engagements/{id}/members:
    get:
      operationId: listEngagementMembers
      tags: [engagements]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EngagementMember" }
    post:
      operationId: addEngagementMember
      tags: [engagements]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddEngagementMemberInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngagementMember" }

  /engagements/{id}/members/{memberId}:
    delete:
      operationId: removeEngagementMember
      tags: [engagements]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: memberId, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Removed

  /admin/orphan-engagements:
    get:
      operationId: listOrphanEngagements
      tags: [engagements]
      description: |
        List engagements that have zero member rows. Admin-only. Used to
        rescue pre-auth demo engagements that would otherwise be invisible
        to every signed-in user.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Engagement" }

  /admin/engagements/{id}/claim:
    post:
      operationId: claimOrphanEngagement
      tags: [engagements]
      description: |
        Adopt an orphaned engagement (no member rows) by adding the caller
        as its owner. Admin-only. Returns 409 if the engagement already has
        members.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Claimed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Engagement" }

  /admin/engagements/{id}:
    delete:
      operationId: deleteOrphanEngagement
      tags: [engagements]
      description: |
        Hard-delete an orphaned engagement (no member rows). Admin-only.
        Returns 409 if the engagement has any members.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Deleted

  /engagements:
    get:
      operationId: listEngagements
      tags: [engagements]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Engagement" }
    post:
      operationId: createEngagement
      tags: [engagements]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEngagementInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Engagement" }

  /engagements/{id}:
    get:
      operationId: getEngagement
      tags: [engagements]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Engagement" }
    patch:
      operationId: updateEngagement
      tags: [engagements]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEngagementInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Engagement" }

  /engagements/{id}/dashboard:
    get:
      operationId: getEngagementDashboard
      tags: [dashboard]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngagementDashboard" }

  /engagements/{id}/activity:
    get:
      operationId: getEngagementActivity
      tags: [dashboard]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: kind
          in: query
          required: false
          description: Comma-separated list of activity kinds to include.
          schema: { type: string }
        - name: severity
          in: query
          required: false
          schema: { type: string, enum: [info, critical] }
        - name: actor
          in: query
          required: false
          description: Case-insensitive substring match against actor name or email.
          schema: { type: string }
        - name: from
          in: query
          required: false
          description: ISO timestamp lower bound (inclusive).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: ISO timestamp upper bound (inclusive).
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityEvent" }

  /engagements/{id}/activity.csv:
    get:
      operationId: exportEngagementActivityCsv
      tags: [dashboard]
      summary: Admin-only CSV export of the audit log (same filters as GET /activity).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: kind, in: query, required: false, schema: { type: string } }
        - { name: severity, in: query, required: false, schema: { type: string, enum: [info, critical] } }
        - { name: actor, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        "403":
          description: Admin role required

  /portfolio:
    get:
      operationId: getPortfolioSummary
      tags: [portfolio]
      summary: Cross-engagement summary scoped to the signed-in user's memberships.
      parameters:
        - { name: industry, in: query, required: false, schema: { type: string } }
        - { name: size, in: query, required: false, schema: { $ref: "#/components/schemas/PortfolioSizeBand" } }
        - { name: from, in: query, required: false, description: "ISO timestamp lower bound (engagement createdAt)", schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, description: "ISO timestamp upper bound (engagement createdAt)", schema: { type: string, format: date-time } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortfolioSummary" }

  /portfolio/heatmap:
    get:
      operationId: getPortfolioHeatmap
      tags: [portfolio]
      summary: Mean dimension scores aggregated across the filtered portfolio.
      parameters:
        - { name: industry, in: query, required: false, schema: { type: string } }
        - { name: size, in: query, required: false, schema: { $ref: "#/components/schemas/PortfolioSizeBand" } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortfolioHeatmap" }

  /portfolio/distribution:
    get:
      operationId: getPortfolioDistribution
      tags: [portfolio]
      summary: |
        Snapshot of how engagements are distributed across the five maturity
        stages for a given month. When `month` is omitted the current month
        is used. Engagements with no scoring at the requested month are
        excluded from the bins and surfaced under `notYetAssessed`.
      parameters:
        - name: month
          in: query
          required: false
          description: Snapshot month as YYYY-MM. Defaults to the current month.
          schema: { type: string }
        - { name: industry, in: query, required: false, schema: { type: string } }
        - { name: size, in: query, required: false, schema: { $ref: "#/components/schemas/PortfolioSizeBand" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortfolioDistribution" }

  /portfolio/distribution/history:
    get:
      operationId: getPortfolioDistributionHistory
      tags: [portfolio]
      summary: |
        Per-month stage distribution for a date range, used to render the
        100% stacked area trend strip beneath the snapshot. Defaults to the
        last 12 months ending in the current month.
      parameters:
        - name: from
          in: query
          required: false
          description: First month inclusive (YYYY-MM). Defaults to 11 months ago.
          schema: { type: string }
        - name: to
          in: query
          required: false
          description: Last month inclusive (YYYY-MM). Defaults to current month.
          schema: { type: string }
        - { name: industry, in: query, required: false, schema: { type: string } }
        - { name: size, in: query, required: false, schema: { $ref: "#/components/schemas/PortfolioSizeBand" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortfolioDistributionHistory" }

  /portfolio/benchmark.csv:
    get:
      operationId: exportPortfolioBenchmarkCsv
      tags: [portfolio]
      summary: |
        Admin-only anonymized benchmark export (industry × size × dimension means).
        Cells with fewer than the anonymity floor (5) contributing engagements
        are suppressed.
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        "403":
          description: Admin role required

  /engagements/{id}/connectors:
    get:
      operationId: listConnectors
      tags: [connectors]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Connector" }
    post:
      operationId: createConnector
      tags: [connectors]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConnectorInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connector" }

  /connectors/{connectorId}:
    patch:
      operationId: updateConnector
      tags: [connectors]
      parameters:
        - { name: connectorId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateConnectorInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connector" }
    delete:
      operationId: deleteConnector
      tags: [connectors]
      parameters:
        - { name: connectorId, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Deleted

  /engagements/{id}/connectors/verify-config:
    post:
      operationId: verifyConnectorConfig
      tags: [connectors]
      description: |
        Stateless verify of an unsaved connector configuration. The wizard
        calls this so the assessor can confirm credentials before saving.
        Token and config are NOT persisted by this call.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyConnectorConfigInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorVerifyResult" }

  /connectors/{connectorId}/verify:
    post:
      operationId: verifyConnector
      tags: [connectors]
      parameters:
        - { name: connectorId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorVerifyResult" }

  /connectors/{connectorId}/run:
    post:
      operationId: runConnector
      tags: [connectors]
      parameters:
        - { name: connectorId, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorRun" }

  /connectors/{connectorId}/runs:
    get:
      operationId: listConnectorRuns
      tags: [connectors]
      parameters:
        - { name: connectorId, in: path, required: true, schema: { type: string } }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConnectorRun" }

  /connectors/{connectorId}/signals:
    get:
      operationId: getConnectorSignals
      tags: [connectors]
      description: |
        Returns the latest run summary plus normalized evidence rows authored
        by this connector. Used by the "view raw signals" drawer in the UI.
      parameters:
        - { name: connectorId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorSignals" }

  /engagements/{id}/survey:
    get:
      operationId: getSurvey
      tags: [survey]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Survey" }
    patch:
      operationId: updateSurvey
      tags: [survey]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSurveyInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Survey" }

  /engagements/{id}/survey/invites:
    get:
      operationId: listSurveyInvites
      tags: [survey]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SurveyInvite" }
    post:
      operationId: createSurveyInvites
      tags: [survey]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSurveyInvitesInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SurveyInvite" }

  /engagements/{id}/survey/responses:
    get:
      operationId: getSurveyAggregates
      tags: [survey]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SurveyAggregates" }

  /survey/respond/{token}:
    get:
      operationId: getSurveyByToken
      tags: [survey]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicSurvey" }
    post:
      operationId: submitSurveyResponse
      tags: [survey]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitSurveyResponseInput" }
      responses:
        "204":
          description: Submitted

  /survey/respond/{token}/draft:
    post:
      operationId: saveSurveyDraft
      tags: [survey]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveSurveyDraftInput" }
      responses:
        "204":
          description: Saved

  /engagements/{id}/survey/close:
    post:
      operationId: closeSurvey
      tags: [survey]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Survey" }

  /engagements/{id}/survey/invites/preview:
    post:
      operationId: previewSurveyInvites
      tags: [survey]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreviewInvitesInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitePreview" }

  /engagements/{id}/interviews:
    get:
      operationId: listInterviews
      tags: [interviews]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Interview" }
    post:
      operationId: createInterview
      tags: [interviews]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInterviewInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Interview" }

  /interviews/{interviewId}:
    get:
      operationId: getInterview
      tags: [interviews]
      parameters:
        - { name: interviewId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Interview" }
    patch:
      operationId: updateInterview
      tags: [interviews]
      parameters:
        - { name: interviewId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateInterviewInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Interview" }
    delete:
      operationId: deleteInterview
      tags: [interviews]
      parameters:
        - { name: interviewId, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Deleted

  /interviews/{interviewId}/evidence:
    get:
      operationId: listInterviewEvidence
      tags: [interviews]
      parameters:
        - { name: interviewId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Evidence" }
    post:
      operationId: addInterviewEvidence
      tags: [interviews]
      parameters:
        - { name: interviewId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEvidenceInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evidence" }

  /evidence/{evidenceId}:
    delete:
      operationId: deleteEvidence
      tags: [evidence]
      parameters:
        - { name: evidenceId, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Deleted

  /interviews/{interviewId}/ai-suggest:
    post:
      operationId: suggestInterviewTags
      tags: [ai]
      parameters:
        - { name: interviewId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterviewTagSuggestions" }

  /engagements/{id}/artifacts:
    get:
      operationId: listArtifacts
      tags: [artifacts]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ArtifactDoc" }
    post:
      operationId: createArtifact
      tags: [artifacts]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateArtifactInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactDoc" }

  /artifacts/{artifactId}:
    delete:
      operationId: deleteArtifactDoc
      tags: [artifacts]
      parameters:
        - { name: artifactId, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Deleted

  /artifacts/{artifactId}/download:
    get:
      operationId: downloadArtifactDoc
      tags: [artifacts]
      parameters:
        - { name: artifactId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Original file bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

  /engagements/{id}/storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL to upload an artifact binary to object storage.
      description: |
        The client posts file metadata and receives a short-lived presigned PUT URL
        plus the canonical objectPath (e.g. `/objects/uploads/<uuid>`). The browser
        then uploads the bytes directly to GCS, and finally calls
        `POST /engagements/{id}/artifacts` with the returned `objectPath` to register
        the artifact. The endpoint is scoped to the engagement so membership is
        enforced and the server can bind the issued objectPath to the calling user;
        only that user may later register an artifact for it (BOLA defence).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadUrlRequest" }
      responses:
        "200":
