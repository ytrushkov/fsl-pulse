[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pulse-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111,<0.112",
    "uvicorn[standard]>=0.29,<0.30",
    "httpx>=0.27,<0.28",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.29,<0.30",
    "alembic>=1.13,<1.14",
    "greenlet>=3.0",
    "redis[hiredis]>=5.0,<6.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "email-validator>=2.1,<3.0",
    "structlog>=24.2,<25.0",
    "python-json-logger>=2.0,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "temporalio>=1.7,<2.0",
    "sentry-sdk[fastapi]>=2.5,<3.0",
    "pulse-llm-gateway",
    "pulse-connector-sdk",
    "pulse-scoring",
    "pulse-shared-models",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<0.24",
    "pytest-cov>=5.0,<6.0",
    "anyio[trio]>=4.3",
    "factory-boy>=3.3,<4.0",
    "vcrpy>=6.0,<7.0",
    "pytest-recording>=0.13",
    "ruff>=0.4,<0.5",
    "mypy>=1.10,<2.0",
    "types-redis>=4.6",
    "types-passlib>=1.7",
    "sqlalchemy[mypy]>=2.0",
    "bandit[toml]>=1.7,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
pulse-llm-gateway   = { workspace = true }
pulse-connector-sdk = { workspace = true }
pulse-scoring       = { workspace = true }
pulse-shared-models = { workspace = true }
