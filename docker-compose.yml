# =============================================================================
# Pulse — Docker Compose (local development only)
# =============================================================================
# Security hardening applied throughout:
#   - No root containers where avoidable (user: named UID or service user)
#   - Network isolation: db and redis are on the 'internal' network only,
#     which has no external routing; api and web alone sit on 'public'
#   - No hardcoded passwords — all sensitive values come from .env via ${VAR}
#   - Read-only root filesystems with explicit tmpfs mounts for writable paths
#   - Health checks use flags/env vars so passwords never appear in ps output
#   - Resource limits (cpu/memory) prevent a runaway container starving others
#   - Ports bound to 127.0.0.1 only — never 0.0.0.0 in dev
# =============================================================================

version: "3.9"

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  # internal: DB and Redis. The 'internal: true' flag prevents any container
  # on this network from making outbound internet connections or being reached
  # from the host without going through the api service.
  internal:
    driver: bridge
    internal: true

  # public: only api and web attach here. These are the only services that
  # accept connections from the host or from each other across the public net.
  public:
    driver: bridge

# ---------------------------------------------------------------------------
# Named volumes (preferred over bind-mounts for data; not world-readable on host)
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:
  minio_data:
  temporal_data:

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      # All values sourced from .env — no literal passwords here.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Require password auth for all connections (no trust / peer auth).
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    # Exposed to loopback for local development and integration tests.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      # pg_isready uses flags, not a connection string — password does not appear
      # in the process argument list visible to 'ps aux'.
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    user: postgres        # UID 70 in the alpine image — not root
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ---------------------------------------------------------------------------
  # Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - redis_data:/data
    # Password passed via flag — requirepass value comes from .env, not hardcoded.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --bind 0.0.0.0
      --protected-mode no
      --save 60 1
    environment:
      # REDISCLI_AUTH lets 'redis-cli PING' authenticate without --no-auth-warning
      # and without the password appearing in the ps argument list.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    # Port not exposed to host.
    # ports:
    #   - "127.0.0.1:6379:6379"
    healthcheck:
      # redis-cli picks up REDISCLI_AUTH from environment automatically.
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
    user: "999:999"   # redis user in the official alpine image
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # ---------------------------------------------------------------------------
  # MinIO (S3-compatible object store — dev only)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    networks:
      - internal
      - public
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      # S3 API — loopback only.
      - "127.0.0.1:9000:9000"
      # MinIO web console — loopback only, dev convenience.
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ---------------------------------------------------------------------------
  # Temporal (workflow engine — single-node dev server)
  # ---------------------------------------------------------------------------
  temporal:
    image: temporalio/auto-setup:latest
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - temporal_data:/etc/temporal
    environment:
      DB: postgres12
      DB_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: db
    depends_on:
      db:
        condition: service_healthy
    # Temporal gRPC not exposed to host — workers reach it via the internal network.
    # ports:
    #   - "127.0.0.1:7233:7233"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ---------------------------------------------------------------------------
  # FastAPI backend
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    restart: unless-stopped
    networks:
      - internal
      - public
    env_file:
      - .env
    environment:
      # Override DSN to use Docker service hostnames, not localhost.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TEMPORAL_HOST: temporal:7233
      S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ./apps/api:/workspace/apps/api:cached
      - ./packages:/workspace/packages:cached
      # JWT signing keys mounted read-only; secrets/ is covered by .gitignore.
      - ./secrets:/workspace/apps/api/secrets:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /health endpoint returns 200 with no auth required and no sensitive data.
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Dockerfile must create 'appuser' with UID 1000 and run as that user.
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  # ---------------------------------------------------------------------------
  # Next.js frontend
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    restart: unless-stopped
    networks:
      - public
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Server-component calls go through the Docker network, not the host.
      API_INTERNAL_URL: http://api:8000
    volumes:
      - ./apps/web:/app/apps/web:cached
      # Anonymous volume prevents host node_modules from shadowing the image's install.
      - /app/apps/web/node_modules
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  # ---------------------------------------------------------------------------
  # Temporal worker (connector runs, survey jobs, LLM processing)
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    restart: unless-stopped
    networks:
      - internal          # Workers never need the public network
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TEMPORAL_HOST: temporal:7233
      S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ./apps/api:/workspace/apps/api:cached
      - ./packages:/workspace/packages:cached
      - ./secrets:/workspace/apps/api/secrets:ro
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
